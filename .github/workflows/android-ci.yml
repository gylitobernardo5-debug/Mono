name: G-VPN Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify bundled Dropbear native binaries
        run: |
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            test -f "app/src/main/jniLibs/${abi}/libdropbear.so"
          done

      - name: Run Unit and Robolectric Tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload G-VPN APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: g-vpn-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
